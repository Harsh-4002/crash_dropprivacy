<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qissora</title>
<meta name="description" content="Qissora - mobile games. Crash Drop for Android.">
<link rel="icon" href="favicon.png">
<style>
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:#1d2a44; background:linear-gradient(180deg,#bfe4ff,#f4faff 70%); min-height:100vh; }
  main { max-width:640px; margin:0 auto; padding:64px 20px; text-align:center; }
  h1 { font-size:2.2rem; margin:0 0 6px; letter-spacing:.5px; }
  p.lead { color:#5b6785; margin:0 0 34px; }
  .game { display:flex; gap:18px; align-items:center; text-align:left; background:#fff; border:1px solid #e3e9f4; border-radius:18px; padding:18px 20px; box-shadow:0 2px 12px rgba(20,60,120,.08); }
  .game img { width:84px; height:84px; border-radius:20px; box-shadow:0 4px 12px rgba(20,60,120,.25); }
  .game h2 { margin:0; font-size:1.3rem; }
  .game p { margin:4px 0 0; color:#5b6785; }
  a { color:#1e7bd8; }
  footer { margin-top:36px; color:#5b6785; font-size:.92rem; }
</style>
</head>
<body>
<main>
  <h1>Qissora</h1>
  <p class="lead">Small games, made with care.</p>
  <div class="game">
    <img src="crashdrop/icon.png" alt="Crash Drop icon">
    <div>
      <h2>Crash Drop</h2>
      <p>Aim the cannon, topple the towers. 1000 levels of block-smashing fun.</p>
      <p><a href="crashdrop/privacy/">Privacy Policy</a></p>
    </div>
  </div>
  <footer>Contact: <a href="mailto:itsharshkantgupta@gmail.com">itsharshkantgupta@gmail.com</a></footer>
</main>
</body>
</html>
